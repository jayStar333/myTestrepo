[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wciclt-collection"
version = "1.0.0"
description = "Create WCICLT Collection Analysis tabs and weekly Collection Reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5",
  "streamlit>=1.32.0",
]

[project.scripts]
wciclt = "wciclt.cli:main"

[tool.setuptools.packages.find]
include = ["wciclt*"]
